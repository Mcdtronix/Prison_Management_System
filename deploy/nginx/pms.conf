# nginx site for pms.mcdtronix.co.zw
# Installed to /etc/nginx/sites-available/pms by deploy/server/bootstrap.sh
#
#   /               React SPA      -> /var/www/pms/current/Frontend/dist
#   /api, /admin,
#   /swagger, /redoc Django API    -> gunicorn (unix socket)
#   /static/        Django static  -> /var/www/pms/current/staticfiles
#   /media/         PRIVATE        -> internal only (see note below)

upstream pms_app {
    server unix:/run/pms/gunicorn.sock fail_timeout=0;
    keepalive 16;
}

# ── HTTP: ACME challenges + redirect everything else to HTTPS ─────────
server {
    listen 80;
    listen [::]:80;
    server_name pms.mcdtronix.co.zw;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pms.mcdtronix.co.zw;

    ssl_certificate     /etc/letsencrypt/live/pms.mcdtronix.co.zw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pms.mcdtronix.co.zw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:PMS_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;
    client_max_body_size 100M;

    access_log /var/log/nginx/pms.access.log;
    error_log  /var/log/nginx/pms.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # ── Django: API, admin, API docs ────────────────────────────────
    location ~ ^/(api|admin|swagger|redoc)(/|\.json|\.yaml|$) {
        proxy_pass http://pms_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;   # matches gunicorn timeout
        proxy_send_timeout 120s;
    }

    # ── Django static files (hashed by WhiteNoise manifest) ─────────
    location /static/ {
        alias /var/www/pms/current/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Uploaded media: NOT publicly readable ──────────────────────
    # Contains inmate photos, court warrants, officer certificates and
    # message attachments. `internal` means only Django can release a file,
    # by answering an authenticated request with
    #   X-Accel-Redirect: /media/<path>
    # Direct requests from browsers get 404.
    location /media/ {
        internal;
        alias /var/www/pms/shared/media/;
    }

    # ── React SPA ───────────────────────────────────────────────────
    root /var/www/pms/current/Frontend/dist;
    index index.html;

    # Vite emits content-hashed bundles: cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or clients keep loading the bundle
    # of a release that has been rolled back or replaced.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
